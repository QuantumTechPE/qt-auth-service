# CodeQL (SAST semántico; gratis en repos públicos). El ruleset de master exige
# que no haya alertas de seguridad HIGH o superiores.
name: Auto · CodeQL

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  codeql:
    name: CodeQL
    uses: QuantumTechPE/qt-infra/.github/workflows/service-codeql.yml@master
    with:
      languages: '["java-kotlin","actions"]'
    permissions:
      contents: read
      actions: read
      security-events: write
