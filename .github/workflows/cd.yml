# CD. La lógica vive en qt-infra; los despliegues los ejecuta Argo CD.
#   push a qt/<n> (rama de la historia QT-<n>) → DEV
#   push a master (PR aprobado)                → congelamiento en QA
#                                                (congela → revierte → recongela)
#                                                + releases + issue de pase
# Sin historia no hay despliegue. Producción: issue de pase (pase.yml).
name: CD

on:
  push:
    branches: [master, "qt/**"]
  workflow_dispatch:

permissions:
  contents: read

# DEV: un push nuevo a la misma rama reemplaza al anterior.
# master: cada congelamiento corre completo (no se cancela).
concurrency:
  group: cd-${{ github.ref_name }}-${{ github.ref_name == 'master' && github.run_id || 'dev' }}
  cancel-in-progress: ${{ github.ref_name != 'master' }}

jobs:
  cd:
    name: CD
    uses: QuantumTechPE/qt-infra/.github/workflows/service-cd.yml@master
    with:
      stack: quarkus
    permissions:
      contents: write
      issues: read
      security-events: write
      id-token: write
      packages: write
      attestations: write
