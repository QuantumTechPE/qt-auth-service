# CD: cada merge a master.
#   build + escaneos → imagen firmada (GHCR) → GitOps dev (automático)
#   release (release-please) → GitOps qa → GitOps prod (aprobación de admins)
# La lógica vive en qt-infra; los despliegues los ejecuta Argo CD en cada clúster.
name: CD

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

jobs:
  cd:
    name: CD
    uses: QuantumTechPE/qt-infra/.github/workflows/service-cd.yml@master
    with:
      stack: quarkus
    permissions:
      contents: write
      security-events: write
      id-token: write
      packages: write
      attestations: write
